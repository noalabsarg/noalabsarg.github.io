<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Entrar al panel</title>
<link rel="stylesheet" href="fuentes.css">
<link rel="stylesheet" href="panel.css">
<style>
  body{display:grid;place-items:center;min-height:100vh;background:#F4F6F9}
  .box{background:#fff;border:1px solid var(--line,#E3E7ED);border-radius:14px;padding:26px 24px;width:min(360px,92vw)}
  .box h1{font-size:20px;margin:0 0 4px}.box p{color:var(--muted,#6B7280);font-size:13.5px;margin:0 0 16px}
  .box .txt{width:100%;box-sizing:border-box;margin-bottom:10px}.box .b{width:100%;justify-content:center}
</style>
</head>
<body>
<main>
<form class="box" id="f" novalidate>
  <h1>Entrar al panel</h1>
  <p>Con el usuario y la contraseña que te dio el dueño del negocio.</p>
  <label class="lbl2" for="u">Usuario</label><input class="txt" id="u" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label class="lbl2" for="c">Contraseña</label><input class="txt" id="c" type="password" autocomplete="current-password">
  <div id="err"></div>
  <button class="b p" id="ok">Entrar</button>
</form>
</main>
<script src="entrar.js"></script>
</body>
</html>
